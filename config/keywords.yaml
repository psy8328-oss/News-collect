# 관심 분야·키워드 설정 (PRD 3.1절)
#
# - name     : 분야 이름 (화면의 분야 태그로 쓰임)
# - weight   : 분야 가중치 1~5. 추천 점수에 곱해진다 (PRD 4.3절).
# - keywords : 검색어 목록. 이 단어로 뉴스를 검색하고, 기사 안에 이 단어가 있으면 해당 분야로 분류한다.
# - exclude  : 제외어. 그 분야에만 적용되고 다른 분야 매칭에는 영향이 없다. 두 종류로 자동 구분된다.
#     * 가리기형 — 제외어 안에 그 분야 키워드가 들어 있는 경우 (예: '포스코퓨처엠' ⊃ '포스코').
#       그 표현만 지우고 다시 매칭한다. 기사에 '포스코'가 따로 있으면 회사 분야로 남는다.
#     * 거부형 — 그 밖의 단어 (예: '상임위'). 기사에 있으면 그 분야를 통째로 뺀다.
# - 키워드 안의 띄어쓰기는 있어도 없어도 매칭된다 ('철강 가격' = '철강가격').
#
# [가중치를 정한 기준]
#   5 = 원자재 가격을 직접 움직이는 핵심 원료 (철광석, 원료탄)
#   4 = 수급·가격에 큰 영향을 주는 요인 또는 관심 대상이 뚜렷한 분야 (중국 정책, 철스크랩, 철강 투자, 회사)
#   3 = 검색어 자체가 넓어서 무관한 기사가 섞이기 쉬운 분야 (철강, 운임)
#       → 가중치를 낮춰 '넓은 단어 하나만 걸린 기사'가 위로 올라오지 않게 한다.
#
# 같은 단어를 두 분야에 넣지 않는다. 한 기사가 '다중 분야 보너스'를 잘못 받는다 (PRD 3.1절).

categories:
  - name: 철강
    # '철강'은 매우 넓은 단어라 가중치를 낮게 둔다. 회사명은 '회사' 분야에만 둔다.
    # '열연' 단독은 드라마 기사('OO 배우의 열연')가 대부분이라 제외어로 막을 수 없었다 (2단계 실측).
    # 그래서 '열연'은 철강 제품을 뜻하는 표현으로만 검색·매칭한다.
    weight: 3
    keywords: [철강, 철강 가격, 열연강판, 열연코일, 열연 가격, 열연 유통, 냉연, 후판, 철근]
    exclude: []

  - name: 철광석
    # 철강 원가의 핵심 원료. 가격 뉴스가 가장 중요하다.
    weight: 5
    # '발레' 단독은 무용 기사가 많아 제외어로 다 막을 수 없었다 (2단계 실측).
    # 그래서 광산사 발레(Vale)를 뜻하는 표현으로만 검색·매칭한다.
    keywords: [철광석, 철광석 가격, 리오틴토, BHP, Vale, 브라질 발레, 발레社]
    exclude: []

  - name: 원료탄
    # 철광석과 함께 고로 원가의 핵심 원료.
    weight: 5
    keywords: [원료탄, 강점결탄, 제철용 석탄]
    exclude: []

  - name: 중국 정책
    # 세계 조강 생산의 절반 이상을 차지하는 중국의 감산·부양책은 원자재 가격을 크게 움직인다.
    weight: 4
    keywords: [중국 정책, 중국 감산, 중국 조강 생산, 중국 부동산 부양, 중국 철강 수출, 국무원, 발개위]
    exclude: []

  - name: 철강 투자
    # 설비 증설·전기로 전환은 중장기 수급과 원료(철스크랩 등) 수요를 바꾼다.
    weight: 4
    # 4단계 검토: '전기로 12개사 적자' 같은 기사를 놓쳐 '전기로'를 추가했다.
    # '전기로 달리는 차'처럼 '전기(電氣)로'라는 뜻은 가리기형 제외어로 거른다.
    keywords: [철강 투자, 제철소 투자, 전기로 투자, 설비 증설, 수소환원제철, 그린스틸, 전기로]
    exclude: [전기로 달리, 전기로 움직, 전기로 충전, 전기로 작동, 전기로 구동, 전기로 가는]

  - name: 철스크랩
    # 전기로 원료. 국내 가격 뉴스 비중이 높다.
    weight: 4
    # 4단계 검토: '남부 스크랩 수입' 같은 업계 기사를 놓쳐 '스크랩'을 추가했다 (뉴스 스크랩 등은 제외).
    keywords: [철스크랩, 고철, 철스크랩 가격, 고철 가격, 스크랩]
    exclude: [스크랩북, 뉴스 스크랩, 기사 스크랩, 스크랩해, 스크랩한]

  - name: 운임
    # '운임'은 택배·항공·버스 기사까지 걸리는 넓은 단어라 가중치를 낮추고 제외어를 둔다.
    weight: 3
    # 4단계 검토: 해운 업황 기사를 놓쳐 해운 관련 표현을 추가했다. '해운'만 쓰면 '해운대'가 걸린다.
    keywords: [운임, 해상운임, 벌크선 운임, BDI, 케이프사이즈, 건화물선, 벌크선, 해운사, 해운업, 해운 시황]
    # 철도·택시·여객선 운임 기사를 거른다. '버스'만 쓰면 '블록버스터'·'에어버스'까지 걸려서 구로 적는다.
    exclude: [택배 운임, 항공 운임, 철도운임, 철도 운임, 버스 운임, 택시 운임, 택시, 시내버스, 시외버스,
              고속버스, 버스요금, 지하철, 여객선, 도시철도, 고속도로]

  - name: 회사
    # '회사'라는 단어로는 검색하지 않고 회사명만 검색한다 (PRD 3.1절).
    # 국내 기사에 실제로 나오는 이름도 함께 둔다: 동부제철→KG스틸, NSC→일본제철, JFE→JFE스틸.
    weight: 4
    keywords: [포스코, 현대제철, 동국제강, 동부제철, KG스틸, NSC, 일본제철, JFE, JFE스틸]
    # 포스코퓨처엠·포스코이앤씨는 가리기형: 계열사 이름만 지우고, '포스코'가 따로 나오면 남긴다.
    # 상임위·국가안보 등은 NSC(국가안전보장회의) 기사를 거르는 거부형.
    exclude: [포스코퓨처엠, 포스코이앤씨, 상임위, 국가안보, 안보실, 국가안전보장]
